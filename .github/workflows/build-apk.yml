name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Web Zips
        run: |
          if [ -f "src.zip" ]; then unzip -o src.zip; fi
          if [ -f "public.zip" ]; then unzip -o public.zip; fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          npm cache clean --force
          npm install --legacy-peer-deps
          npm run build

      - name: Install Capacitor & Generate Android Platform
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init app-name com.app.net --web-dir dist --yes || true
          npx cap add android || true
          npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Force Java 21 in All Gradle Files
        run: |
          # فرض استخدام Java 21 في جميع ملفات البناء والإعدادات لتتوافق مع مكتبات كاباسيتور الحديثة
          find android -name "*.gradle" -exec sed -i 's/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g' {} + || true
          find android -name "*.gradle" -exec sed -i 's/java 17/java 21/g' {} + || true
          find android -name "*.gradle" -exec sed -i 's/1.8/21/g' {} + || true

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
