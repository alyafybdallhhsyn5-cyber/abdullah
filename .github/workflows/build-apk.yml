name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Web Zips
        run: |
          if [ -f "src.zip" ]; then unzip -o src.zip; fi
          if [ -f "public.zip" ]; then unzip -o public.zip; fi
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies & Build Web
        run: |
          npm cache clean --force
          npm install --force --legacy-peer-deps
          npm run build

      - name: Install Capacitor & Generate Android Platform
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          npx cap init app-name com.app.net --web-dir dist --yes || true
          npx cap add android || true
          npx cap sync android

      - name: Generate App Icons and Splash Screens
        run: |
          npm install @capacitor/assets --save-dev --force --legacy-peer-deps
          npx capacitor-assets generate --android

      # --- تعديل ملفات الأندرويد لإظهار شاشة البداية لمدة 3 ثواني وإخفاء الشريط العلوي ---
      - name: Force Splash Screen Settings
        run: |
          STYLES_FILE="android/app/src/main/res/values/styles.xml"
          if [ -f "$STYLES_FILE" ]; then
            # إضافة خلفية لشاشة البداية
            sed -i 's/<item name="android:background">.*<\/item>/<item name="android:background">@drawable\/splash<\/item>/g' "$STYLES_FILE" || true
          fi
          
          # إضافة تأخير لمدة 3 ثواني في ملف MainActivity
          MAIN_ACTIVITY="android/app/src/main/java/com/app/net/MainActivity.java"
          if [ -f "$MAIN_ACTIVITY" ]; then
            sed -i 's/super.onCreate(savedInstanceState);/super.onCreate(savedInstanceState);\n        try { Thread.sleep(3000); } catch (InterruptedException e) { e.printStackTrace(); }/g' "$MAIN_ACTIVITY"
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Fix Kotlin Duplicate Classes Permanently
        run: |
          PROP_FILE="android/gradle.properties"
          if [ -f "$PROP_FILE" ]; then
            echo "android.useAndroidX=true" >> "$PROP_FILE"
            echo "android.enableJetifier=true" >> "$PROP_FILE"
          fi

          BUILD_FILE="android/build.gradle"
          if [ -f "$BUILD_FILE" ]; then
            cat << 'EOT' >> "$BUILD_FILE"

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
                  }
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
                  exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
              }
          }
          EOT
          fi

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleDebug --refresh-dependencies

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
